#To add a new event:
#1.Add a new instance of "name" and a unique "slug" here
#2.Create a new .md inside the works folder, and name it <slug>.md (make sure the spelling, casing and hyphens match the slug e.g. works/spotlight-volume-1.md)
#3.In each relevant post, set "event: <slug>" (e.g. event: spotlight-volume-1)

- name: "WriterSpotlight Vol. 1: Transition in Reference"
  slug: spotlight-volume-1
